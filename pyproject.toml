[project]
name = "factory-environment-alarm"
version = "0.2.0"
description = "Linux + PostgreSQL version of the Factory Environment Alarm learning project"
readme = "README.md"
authors = [
    { name = "chodaseul", email = "badaseull@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "psycopg[binary]>=3.3.5",
    "pyserial>=3.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
